<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17446c"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.ico"><link rel="apple-touch-icon" href="./icon-192.png"><title>ŠPMC – Mano tvarkaraštis</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#142b43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#17446c;color:white;padding:25px 18px}header>div,main{max-width:740px;margin:auto}h1{font-size:24px;margin:0 0 5px}header p{margin:0;font-size:14px;color:#d8e7f4}main{padding:16px 14px 70px}.panel,.lesson,.notice{background:#fff;border:1px solid #e0e6ee;border-radius:14px;padding:15px;margin-bottom:13px}.notice{border-left:4px solid #c78b25;font-size:14px}.ok{border-left-color:#3c8d68}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #bccbd9;border-radius:10px;background:#fff;color:#142b43;font-size:16px}.weekbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}button{border:1px solid #c7d3df;background:#fff;color:#17446c;border-radius:10px;padding:10px 8px;cursor:pointer;font-weight:650}.weekbar button.active,.days button.active{background:#17446c;color:white;border-color:#17446c}.days button{padding:11px 0;font-size:13px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}h2{font-size:19px;margin:18px 0 10px}.lesson{display:flex;gap:12px;margin:8px 0}.num{flex:0 0 43px;background:#e9f2f9;color:#17446c;border-radius:9px;padding:9px 4px;text-align:center;font-weight:800;align-self:flex-start}.content{overflow-wrap:anywhere;line-height:1.5}.muted,.status,.foot{color:#60778a;font-size:13px}.empty{padding:24px;text-align:center;background:#fff;border-radius:12px;color:#66798b}.foot{font-size:12px;margin-top:22px}#period-label{font-weight:700}#notice[hidden]{display:none}@media(max-width:420px){.fields{grid-template-columns:1fr}.days button{font-size:11px}.num{flex-basis:36px}}
</style></head><body><header><div><h1>Mano tvarkaraštis</h1><p>Šilutės profesinio mokymo centras</p></div></header><main><div id="notice" class="notice" hidden></div><section class="panel"><div class="fields"><div class="full"><label for="period">Tvarkaraščio laikotarpis</label><select id="period"></select></div><div class="full"><label for="section">Skyrius</label><select id="section"></select></div><div class="full"><label for="group">Mano grupė</label><select id="group"></select></div></div><div class="weekbar"><button type="button" data-week="1">1-oji savaitė</button><button type="button" data-week="2">2-oji savaitė</button></div><div id="days" class="days"></div></section><div class="actions"><button id="today" type="button">Rodyti šiandieną</button><button id="refresh" type="button">Tikrinti atnaujinimus</button></div><div class="muted" id="period-label"></div><h2 id="heading"></h2><div id="lessons"></div><div class="status" id="status"></div><p class="foot">Programėlė įsimena pasirinktą grupę. Jei nėra interneto, rodomas paskutinis įrenginyje išsaugotas tvarkaraštis. Prieš vykdami į pamokas patikrinkite, ar duomenys atnaujinti.</p></main><script src="./app.js" defer></script></body></html>
